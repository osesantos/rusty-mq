[package]
name = "rustymq"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustymq"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
tonic = "0.11"
prost = "0.12"
tokio-stream = "0.1.17"
async-stream = "0.3.6"
colored = "2"
chrono = "0.4.41"

[build-dependencies]
tonic-build = "0.11"
